name: Claude Code

# Make each run identifiable by the PR/issue it belongs to.
#
# Runs triggered by `issue_comment` are always attributed to the DEFAULT branch —
# an issue comment carries no ref, so GitHub reads the workflow from `main` and
# reports `headBranch: main` even when the comment is on a PR whose head is a
# feature branch. (That is a security property, not a quirk: it stops a PR author
# from editing this file in their branch and running it with repository secrets.)
#
# Consequence: `gh run list --branch <feature-branch>` can never find a review run.
# This run-name restores a PR-scoped handle, so runs can be located with:
#   gh run list --workflow=claude.yml --json databaseId,displayTitle
#
# NOTE: the value must stay quoted. Unquoted, YAML treats the " #" before the
# expression as the start of a comment and the name silently truncates to
# "Claude —", losing the number this exists to carry.
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

# A PR that edits THIS FILE gets no Claude review.
#
# claude-code-action refuses to run when the workflow file differs from the copy on
# the default branch — "The workflow file must exist and have identical content to
# the version on the repository's default branch". That is a security property: it
# stops a PR author rewriting this workflow and running it with repository secrets.
# But the refusal exits CLEANLY — the step succeeds having reviewed nothing, which
# left a green `claude` check indistinguishable from a clean review (observed on
# #169: zero comments, green check). The guard step before the action exists to
# turn that silence into a red check that says "review this PR by hand".
#
# Changes to this file still cannot be verified by the PR that makes them. They take
# effect on merge, and the first PR afterwards that does NOT touch this file is what
# actually proves them. Plan the verification accordingly.

on:
  # Automatic first-pass review. Deliberately NOT `synchronize` — that would fire a
  # full review on every push, which is both noisy and costly. Ask for follow-up
  # passes with an `@claude` comment, which the triggers below already handle.
  #
  # Unlike `issue_comment`, `pull_request` runs ARE attributed to the PR's head ref,
  # so these show up under `gh run list --branch <feature-branch>`.
  #
  # Caveat if this repo ever takes outside contributions: `pull_request` runs from a
  # FORK get no secrets, so CLAUDE_CODE_OAUTH_TOKEN is empty and the run fails rather
  # than reviewing. Same-repo branches (the current workflow) are unaffected.
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # THIS REPOSITORY IS PUBLIC, so anyone can open an issue or leave a comment.
    #
    # Only `pull_request` is protected by GitHub withholding secrets from fork runs.
    # The other four triggers execute in the BASE repo context with full secrets no
    # matter who authored the comment, and for them `prompt` is empty, so the agent
    # follows whatever the comment says. Gating on `@claude` alone therefore lets any
    # stranger drive this agent with the tools in `claude_args` — including
    # `Bash(gh api:*)`, which permits `-X POST`/`-X DELETE`.
    #
    # So every trigger also requires a trusted author. Do not remove these checks
    # while `claude_args` grants write-capable tools.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # A PR that edits this workflow cannot be reviewed by it: claude-code-action
      # refuses a workflow file that differs from the default branch's copy, and the
      # refusal exits green (see the note at the top of this file). Fail first,
      # loudly, so a green `claude` check always means a review actually ran.
      #
      # The comparison mirrors the action's own: on `pull_request` the checkout is
      # the MERGE commit, so a PR that does not touch this file compares identical
      # to the base branch even when the base has moved. Only `pull_request` runs
      # attach a check to the PR, so only they need the guard — comment-triggered
      # runs read this file from `main` and are attributed there.
      - name: Refuse to no-op when this PR edits the review workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude.yml; then
            echo "::error file=.github/workflows/claude.yml::This PR edits the review workflow, so claude-code-action would refuse to run and exit green having reviewed nothing. Failing instead: review this PR by hand. The edit takes effect on merge, and the first later PR that does not touch this file is what proves it."
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.179
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # `pull_request` runs have no comment to follow, so give them an explicit
          # brief. Every other trigger passes an empty string, which leaves the action
          # following the instruction in the comment that mentioned @claude.
          prompt: ${{ github.event_name == 'pull_request' && 'Review this pull request. Focus on correctness, security, and whether the change actually does what its description claims. Verify factual assertions in the diff against the real files rather than assuming they hold. Post your findings as a comment even when you find nothing, so that a clean pass is distinguishable from a silent one.' || '' }}

          # Without this, the automatic review reads the diff and then throws the
          # result away.
          #
          # Supplying `prompt` makes v1 auto-detect **agent mode** (the explicit
          # `mode:` input is deprecated), and agent mode creates no tracking comment
          # and hands the agent no comment-posting tool. So the run does the work,
          # exits `is_error: false`, and posts nothing — a green check on a review
          # that nobody can read. Asking for it in the prompt above cannot help:
          # there is no tool to honour the request with. Confirmed on #163 and #164,
          # whose logs show `Mode: agent` and, unlike an @claude run, not one
          # `mcp__github_comment__update_claude_comment` call.
          #
          # `track_progress` forces tag mode while keeping the brief above: the
          # action pre-creates the tracking comment and gives the agent the tool to
          # fill it in. Scoped to `pull_request` because every other trigger here is
          # already in tag mode and needs no forcing.
          #
          # NOTE: this is NOT a permissions problem, and granting `issues: write` /
          # `pull-requests: write` would not have fixed it. The action posts with its
          # own OIDC-minted token (hence `id-token: write`), which is why @claude runs
          # comment happily under the read-only scopes above.
          track_progress: ${{ github.event_name == 'pull_request' }}

          # `--model` picks the reviewer. Left unset the action runs on Sonnet (run
          # 30373275450 logged `"model": "claude-sonnet-5"`), and review is the one job
          # here worth the stronger model. v1 has no `model` input — `claude_args` is
          # the only vehicle, and it is a single string, so this shares the line with
          # the tool list below.
          #
          # Let the reviewer check claims against primary sources instead of recalling
          # them. Without this, WebSearch/WebFetch fail closed: `--allowedTools` is an
          # AUTO-APPROVAL list, not an availability restriction (use `--tools` for
          # that), so an omitted tool still exists but hits a permission prompt — and
          # in headless CI nothing can answer it, so the call comes back denied. That
          # is what a reviewer on #122 hit: "I still don't have working
          # WebSearch/WebFetch (both came back as permission-denied)".
          #
          # This ADDS to the defaults rather than replacing them — per the action docs,
          # "the base GitHub tools are always included" — so file reading and comment
          # posting are unaffected.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          # `Bash(gh api:*)` lets the reviewer check repository configuration that is not
          # in the tree — rulesets, required checks, run status. Two independent reviews of
          # #122 had to report the ruleset claims in babysit-pr/SKILL.md as unverifiable
          # without it, and both correctly declined to assert them on the author's word.
          #
          # Broader than read-only: `gh api` accepts `-X POST`/`-X DELETE`, and prefix
          # matching cannot exclude those. What keeps that safe is the author gate in the
          # job's `if:` above, NOT fork-secret withholding — this repo is public, and four
          # of the five triggers run in the base repo context with full secrets whoever
          # wrote the comment. Removing the author gate re-opens arbitrary API writes to
          # any commenter.
          #
          # `Bash(git:*)` and the two `scripts/` prefixes let the reviewer RUN things
          # instead of only reading them. The reviewer on #133 had every such call
          # denied ("everything below is static analysis"), and the reviews of #175
          # showed why that matters: every claim made by reading alone needed
          # correcting, every claim that arrived with a run held. The repo's tooling
          # scripts are dependency-free by design — they must work on a bare checkout —
          # so granting them costs no setup. Git writes cannot land: the checkout's
          # persisted token has `contents: read`, so a push is refused server-side.
          #
          # Deliberately NOT granted: the real test suites (just / pnpm / uv). They
          # need toolchains this job does not install, so approving them would only
          # convert a permission denial into a command-not-found. CI runs the suites
          # on every PR; the reviewer reads those results through `actions: read`
          # instead of re-running them. Revisit only together with setup steps, and
          # weigh the minutes they add to every review pass.
          claude_args: '--model claude-opus-4-8 --allowedTools "WebSearch,WebFetch,Bash(gh api:*),Bash(git:*),Bash(bash scripts/:*),Bash(python3 scripts/:*)"'
