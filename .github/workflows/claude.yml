name: Claude Code

# Make each run identifiable by the PR/issue it belongs to.
#
# Runs triggered by `issue_comment` are always attributed to the DEFAULT branch —
# an issue comment carries no ref, so GitHub reads the workflow from `develop` and
# reports `headBranch: develop` even when the comment is on a PR whose head is a
# feature branch. (That is a security property, not a quirk: it stops a PR author
# from editing this file in their branch and running it with repository secrets.)
#
# Consequence: `gh run list --branch <feature-branch>` can never find a review run.
# This run-name restores a PR-scoped handle, so runs can be located with:
#   gh run list --workflow=claude.yml --json databaseId,displayTitle
#
# NOTE: the value must stay quoted. Unquoted, YAML treats the " #" before the
# expression as the start of a comment and the name silently truncates to
# "Claude —", losing the number this exists to carry.
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

# A PR that edits THIS FILE gets no Claude review.
#
# claude-code-action refuses to run when the workflow file differs from the copy on
# the default branch — "The workflow file must exist and have identical content to
# the version on the repository's default branch". That is a security property: it
# stops a PR author rewriting this workflow and running it with repository secrets.
# But the refusal exits CLEANLY — the step succeeds having reviewed nothing, which
# left a green `claude` check indistinguishable from a clean review (observed on
# #169: zero comments, green check). The guard step before the action exists to
# turn that silence into a red check that says "review this PR by hand".
#
# Changes to this file still cannot be verified by the PR that makes them. They take
# effect on merge, and the first PR afterwards that does NOT touch this file is what
# actually proves them. Plan the verification accordingly.

on:
  # Automatic first-pass review. Deliberately NOT `synchronize` — that would fire a
  # full review on every push, which is both noisy and costly. Ask for follow-up
  # passes with an `@claude` comment, which the triggers below already handle.
  #
  # Unlike `issue_comment`, `pull_request` runs ARE attributed to the PR's head ref,
  # so these show up under `gh run list --branch <feature-branch>`.
  #
  # Caveat if this repo ever takes outside contributions: `pull_request` runs from a
  # FORK get no secrets, so CLAUDE_CODE_OAUTH_TOKEN is empty and the run fails rather
  # than reviewing. Same-repo branches (the current workflow) are unaffected.
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # THIS REPOSITORY IS PUBLIC, so anyone can open an issue or leave a comment.
    #
    # Only `pull_request` is protected by GitHub withholding secrets from fork runs.
    # The other four triggers execute in the BASE repo context with full secrets no
    # matter who authored the comment, and for them `prompt` is empty, so the agent
    # follows whatever the comment says. Gating on `@claude` alone therefore lets any
    # stranger drive this agent, which can still comment and edit through the
    # action's own tools.
    #
    # So every trigger also requires a trusted author. Do not remove these checks.
    #
    # The trigger is not enough: the agent can read the action's write-scoped app
    # token (see `claude_args`), so everything it reads must come from a trusted
    # account too. Comment triggers also require the issue's or PR's author to be
    # trusted, and `include_comments_by_actor` drops everyone else's comments
    # from the prompt. What is left is WebSearch results and anything a trusted
    # account pastes in.
    #
    # The author checks do not stop a trusted member's PR from a fork, which
    # would still feed that fork's code to the agent. So the first step below
    # refuses PRs from forks.
    #
    # As a result, `@claude` silently does nothing on PRs opened by bots such as
    # Dependabot (author association CONTRIBUTOR). That is on purpose: their
    # bodies carry upstream release notes, written by whoever maintains the
    # dependency. Review those with Claude locally instead.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # Reviews take a few minutes. The limit stops a hung run from billing for
    # the six-hour default.
    timeout-minutes: 30
    # One run per PR or issue at a time. A second @claude waits for the first,
    # so two runs never post overlapping reviews or push to the same branch.
    # The group is on this job, not on the workflow. At workflow level, every
    # comment would join it, even one without @claude. GitHub keeps only one
    # pending run per group, so such a comment would cancel a queued review.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      # Fails closed: if the lookup fails or the fork is gone, `head` is empty
      # and the run stops. Issues that are not PRs leave `PR` empty and pass.
      - name: Refuse to run on pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          [ -z "$PR" ] && exit 0
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name // ""') || head=
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR comes from ${head:-an unknown repository}, not $GITHUB_REPOSITORY. Claude does not run on fork PRs: review it by hand."
            exit 1
          fi

      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to
      # other code, and this job holds the repo's Claude token. To bump one,
      # resolve the new tag to its commit and update the trailing comment.
      #
      # `persist-credentials: false`: the action writes its own token into the
      # checkout before Claude starts, so the job's token has no reason to be
      # there at all. The guard below fetches anonymously, which a public repo
      # allows.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A PR that edits this workflow cannot be reviewed by it: claude-code-action
      # refuses a workflow file that differs from the default branch's copy, and the
      # refusal exits green (see the note at the top of this file). Fail first,
      # loudly, so a green `claude` check always means a review actually ran.
      #
      # The comparison mirrors the action's own: on `pull_request` the checkout is
      # the MERGE commit, so a PR that does not touch this file compares identical
      # to the base branch even when the base has moved. Only `pull_request` runs
      # attach a check to the PR, so only they need the guard — comment-triggered
      # runs read this file from `develop` and are attributed there.
      - name: Refuse to no-op when this PR edits the review workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude.yml; then
            echo "::error file=.github/workflows/claude.yml::This PR edits the review workflow, so claude-code-action would refuse to run and exit green having reviewed nothing. Failing instead: review this PR by hand. The edit takes effect on merge, and the first later PR that does not touch this file is what proves it."
            exit 1
          fi

      # The review plugin, pinned to one commit like the action below. The
      # documented route, `plugin_marketplaces: .../claude-code.git`, reads a
      # catalog from that repo's default branch, and the catalog points the
      # plugin at `main` of this repo. Each review would then run whatever
      # landed there that day, with this job's token and tools. A checkout at a
      # SHA pins the command and the tools it grants itself.
      #
      # The plugin loads with `--plugin-dir` (in `claude_args` below), not as a
      # marketplace. This repo's catalog is named `claude-plugins-official`, and
      # Claude Code accepts that name only from a GitHub source in the
      # `anthropics` org. As a local marketplace it is refused, and the action
      # stops before Claude starts, on every trigger.
      #
      # Dependabot does not bump this `ref:`. Move it by hand: pick a commit
      # that touches plugins/code-review and is at least 7 days old, like the
      # quarantine on every other dependency.
      - name: Check out the review plugin at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: 9780cf407f5593727b668bae95a0c4ae2e0de1ae # code-review 1.0.1, 2026-10-26
          path: .review-plugins
          persist-credentials: false

      # The plugin looks for the repo's rules only in CLAUDE.md files, and this
      # repo keeps them in AGENTS.md. Link them here, in CI only: committing a
      # CLAUDE.md would make local Claude Code sessions load the rules twice.
      #
      # The links and the plugin checkout stay untracked. An `@claude` run that
      # commits could pick them up with `git add .`, so git is told to ignore
      # them.
      - name: Expose AGENTS.md as CLAUDE.md for the review plugin
        run: |
          for dir in . frontend backend; do
            ln -s AGENTS.md "$dir/CLAUDE.md"
          done
          printf '%s\n' /.review-plugins /CLAUDE.md /frontend/CLAUDE.md /backend/CLAUDE.md >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Solo los comentarios, reviews y comentarios en línea de estas cuentas
          # llegan al prompt; los de cualquier otra se descartan. Si añades un
          # colaborador al repo, añádelo aquí o Claude no verá sus comentarios.
          include_comments_by_actor: "jzfgo,claude[bot]"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The automatic review on `pull_request` runs exactly like an `@claude`
          # re-review: tag mode, the same default prompt (PR title and body,
          # comments, changed files, CLAUDE.md) and one tracking comment edited
          # in place. `track_progress` is what forces tag mode on this event;
          # without it a `prompt` means agent mode, which has no tool to post
          # with (#163, #164). The prompt below stands in for the comment a
          # person would have written, and the action appends it as custom
          # instructions.
          #
          # It used to run the official `code-review` plugin instead. That
          # plugin keeps only high-confidence bugs and quotable CLAUDE.md
          # breaches and drops edge cases, risks and test gaps by design, so on
          # #530-#532 it posted "No issues found" where an `@claude` re-review
          # of the same commit returned a full report. It is still installed
          # (`--plugin-dir` in `claude_args`), so
          # `@claude /code-review:code-review` runs it on request.
          #
          # Every other trigger passes an empty prompt, which leaves the action
          # following the instruction in the comment that mentioned @claude, in
          # tag mode as before.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: ${{ github.event_name == 'pull_request' && format('Review this pull request in full (HEAD {0}). Read the whole diff against the base branch and the code around it, and check it against the PR title and description and against every AGENTS.md or CLAUDE.md that covers the changed files. Report bugs, unhandled edge cases, risks, gaps in test coverage and mismatches with the description, and say which ones should block the merge. Post your findings in your comment even if there are none.', github.event.pull_request.head.sha) || '' }}

          # NOTE: posting is NOT a permissions problem, and granting `issues: write`
          # / `pull-requests: write` would not change it. The action posts with its
          # own OIDC-minted token (hence `id-token: write`), which is why runs
          # comment happily under the read-only scopes above.

          # `--model` picks the reviewer. Left unset the action runs on Sonnet (run
          # 30373275450 logged `"model": "claude-sonnet-5"`), and review is the one job
          # here worth the stronger model. v1 has no `model` input — `claude_args` is
          # the only vehicle, and it is a single string, so this shares the line with
          # the tool list below.
          #
          # Let the reviewer check claims against primary sources instead of recalling
          # them. Without this, WebSearch fails closed: `--allowedTools` is an
          # AUTO-APPROVAL list, not an availability restriction (use `--tools` for
          # that), so an omitted tool still exists but hits a permission prompt — and
          # in headless CI nothing can answer it, so the call comes back denied. That
          # is what a reviewer on #122 hit: "I still don't have working
          # WebSearch/WebFetch (both came back as permission-denied)".
          #
          # WebFetch is left off on purpose, so it stays denied. The action writes its
          # write-scoped app token into origin's URL in `.git/config`, and Claude can
          # read it: read-only shell commands are auto-approved, and a glob
          # (`cat .g?t/c*`) slips past `Read(./.git/**)` deny rules, so no denylist
          # hides it. WebFetch would let injected text send it to any server. Without
          # it the only ways out are a GitHub comment, a push to the PR branch, or
          # the job summary (its final message and tool inputs; see "Summarise what
          # the agent did"), all public, and the action revokes the token when the
          # job ends (its `Revoke app token` step).
          #
          # This ADDS to the defaults rather than replacing them — per the action docs,
          # "the base GitHub tools are always included" — so file reading and comment
          # posting are unaffected.
          #
          # `mcp__github_inline_comment__create_inline_comment` is how the plugin
          # comments on a line. Listing it here is also what makes the action
          # start that tool's server at all: it does so only when the tool is
          # allowed.
          #
          # `--plugin-dir` loads the pinned plugin checkout for this session only.
          # Its commands keep the plugin's name, so it is `/code-review:code-review`.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          #
          # This file grants no Bash, on purpose. (Tag mode, which every
          # trigger now runs in, still adds the action's own `git add`/`commit`/
          # `rm` and push wrapper, so any run, the automatic review included,
          # can push to the PR branch.) A prefix rule
          # cannot vet arguments, and each of the grants this job used to carry
          # let injected text in a PR or issue write or run code:
          # - `Bash(gh api:*)`: `-X POST`/`-X DELETE` can follow any prefix.
          # - `Bash(git:*)`: `git -c <key>=<cmd>` and `git config` run commands.
          #   Even "read-only" subcommands escape: `--output=<file>` on
          #   log/diff/show writes any file, and a bare repo committed in a PR
          #   brings its own config (fsmonitor, pager) that git obeys inside it.
          # - `Bash(bash scripts/:*)`, `Bash(python3 scripts/:*)`: on a PR, the
          #   checkout holds the PR's own `scripts/`, so these run whatever the
          #   PR wrote.
          # The job's `contents: read` does not contain any of that: the action
          # acts with its own app token. The reviewer reads code with Read and
          # Grep and flags claims about repo settings (rulesets, required
          # checks) as unverified. Tag mode also gives every run the CI tools
          # that read results through `actions: read`.
          #
          # `--disallowedTools ScheduleWakeup`: see the step's `env` below.
          claude_args: '--model claude-opus-5-5 --plugin-dir ${{ github.workspace }}/.review-plugins/plugins/code-review --allowedTools "mcp__github_inline_comment__create_inline_comment,WebSearch" --disallowedTools "ScheduleWakeup"'
        # Subagents must run in the foreground. Launched in the background,
        # the main agent ends its turn "waiting on them", the headless
        # session exits there, and they die before posting: run
        # 44847076788 (#528) ended with "Three review agents are still running;
        # waiting on them." and a ScheduleWakeup call. That is why most
        # automatic reviews since #514 posted nothing. The variable removes
        # `run_in_background` from Agent and Bash, and the action passes the
        # step's environment to Claude. A prompt asking for the foreground
        # would only be a suggestion; this leaves no choice.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

      # Tag mode creates the tracking comment before Claude starts, so a
      # comment on the PR no longer proves the review posted anything. What
      # does is a call to the tool that writes into that comment, or to the
      # inline-comment tool. `review-skipped` reads this output. No execution
      # file, or one it cannot read, means nothing was posted.
      - name: Check whether the agent posted its review
        id: posted
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          posted=false
          if [ -f "$EXECUTION_FILE" ] && jq -e '
            any(.[] | select(.type == "assistant") | .message.content[]?;
              .type == "tool_use" and (.name == "mcp__github_comment__update_claude_comment"
                or .name == "mcp__github_inline_comment__create_inline_comment"))
          ' "$EXECUTION_FILE" > /dev/null; then
            posted=true
          fi
          echo "posted=$posted" >> "$GITHUB_OUTPUT"

      # The action hides the agent's output, and the log keeps only a count of
      # denied tool calls. That left skipped reviews undiagnosable (#520, #522,
      # #524, #525). This step writes three things to the job summary, from
      # the execution file the action leaves on the runner: the agent's final
      # message, the tool calls it made, and the ones that were denied.
      #
      # Not the whole transcript, and not `show_full_output`. The repo is
      # public, so the summary is public too, and file contents the agent
      # read stay out of it. Each tool input is cut to 300 characters and the
      # final message to 4000. Inputs go in code spans, so text the agent
      # echoes (an `<!--`, say) cannot hide the rest of the summary. The
      # action only shows full output when `ACTIONS_STEP_DEBUG` is in the
      # step's environment, so `gh run rerun --debug` does not reveal it.
      #
      # `always()`: a failed run is the one most worth reading. The file is
      # missing only when the action stopped before Claude started.
      # `continue-on-error`: a diagnostic must not change the outcome. A
      # failure here would turn a good review red and, through `needs`, stop
      # `review-skipped` from commenting.
      - name: Summarise what the agent did
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || { echo "No execution file at $EXECUTION_FILE."; exit 0; }
          jq -r '
            def cut: tostring | if length > 300 then .[:300] + "…" else . end;
            def inline: cut | gsub("[\r\n]"; " ") | gsub("`"; "ʼ");
            (map(select(.type == "result")) | last) as $r
            | "## Claude run",
              "",
              "`\($r.subtype // "no result")`, is_error=\($r.is_error | if . == null then "?" else . end), \($r.num_turns // "?") turns, \($r.duration_ms | if . == null then "?" else ./1000 | floor end) s, $\($r.total_cost_usd // "?")",
              "",
              "### Final message",
              "",
              "```",
              ($r.result // "(none)" | if length > 4000 then .[:4000] + "…" else . end | gsub("```"; "ʼʼʼ")),
              "```",
              "",
              "### Tool calls",
              "",
              (map(select(.type == "assistant"))[]
                | (if .parent_tool_use_id then "subagent" else "main" end) as $who
                | .message.content[]? | select(.type == "tool_use")
                | "- \($who) `\(.name)`: `\(.input | inline)`"),
              "",
              "### Permission denials",
              "",
              (($r.permission_denials // []) | if length == 0 then "None." else
                (.[] | "- `\(.tool_name)`: `\(.tool_input | inline)`") end)
          ' "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

  # A run can still end green having posted nothing: the agent can end its
  # turn without writing its findings into the tracking comment (the
  # background-task hang on #528, a turn limit). The action then fills that
  # comment with only its "Claude finished" header, which reads like a clean
  # review. This job says on the PR that no review was posted.
  #
  # It is a separate job so that its write token never reaches the agent: the
  # `claude` job keeps read-only scopes. `needs` makes this job wait for it and
  # run only when it succeeded, because a failed run is already a red check.
  review-skipped:
    needs: claude
    if: github.event_name == 'pull_request' && needs.claude.outputs.posted != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment when the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Unquoted delimiter so $RUN_URL expands; the backticks are escaped.
          gh pr comment "$PR" --body-file - <<MSG
          Revisión automática omitida: el run terminó sin publicar nada. Lo que hizo el agente está en el resumen del run: $RUN_URL

          Si quieres una revisión, comenta \`@claude\` pidiéndola.
          MSG
