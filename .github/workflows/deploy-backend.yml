name: Deploy Backend

# Required GitHub Actions variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_REGION              e.g. europe-west1
#   GCP_PROJECT             GCP project ID
#   ARTIFACT_REGISTRY_REPO  Artifact Registry repository name
#   CLOUDRUN_SERVICE        Cloud Run service name
#   ALLOWED_ORIGINS         e.g. ["https://your-app.web.app"]
#   FRONTEND_URL            e.g. https://your-app.web.app
#   RECEIPT_STORAGE_BUCKET  e.g. your-app.firebasestorage.app
#   SMTP_HOST, SMTP_PORT, SMTP_USER, EMAIL_FROM, EMAIL_REDIRECT_TO  (email; empty host = off)
#   Secrets: SMTP_PASSWORD, EMAIL_TOKEN_SECRET, REPORT_TRIGGER_TOKEN
#   (the same names exist in both the Production and Staging environments)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Manual deploys (first staging deploy, re-deploys without a code change).
  # Pick the branch in the dispatch UI; the environment follows the ref.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}

    steps:
      - uses: actions/checkout@v7

      # Staging runs on a copy of production data, so its email must go to
      # one test inbox. Refuse to deploy a staging that would mail real users.
      - name: Check staging email redirect
        if: github.ref_name != 'main'
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          EMAIL_REDIRECT_TO: ${{ vars.EMAIL_REDIRECT_TO }}
        run: |
          if [ -n "$SMTP_HOST" ] && [ -z "$EMAIL_REDIRECT_TO" ]; then
            echo "::error::Staging has SMTP_HOST set but no EMAIL_REDIRECT_TO."
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/backend:${SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUDRUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            FIREBASE_CREDENTIALS_PATH=/secrets/firebase-credentials
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            RECEIPT_STORAGE_BUCKET=${{ vars.RECEIPT_STORAGE_BUCKET }}
            WAITLIST_ENABLED=${{ vars.WAITLIST_ENABLED }}
            REPORT_TRIGGER_TOKEN=${{ secrets.REPORT_TRIGGER_TOKEN }}
            REPORT_DEFAULT_TIMEZONE=${{ vars.REPORT_DEFAULT_TIMEZONE || 'UTC' }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT || '465' }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            EMAIL_REDIRECT_TO=${{ vars.EMAIL_REDIRECT_TO }}
            EMAIL_TOKEN_SECRET=${{ secrets.EMAIL_TOKEN_SECRET }}
          secrets: |
            /secrets/firebase-credentials=firebase-credentials:latest
