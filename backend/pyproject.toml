[project]
name = "carroquesi-backend"
version = "0.26.0"
description = "CarroQueSí API – grocery list and receipt analysis service"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.139.2",
    "firebase-admin>=7.5.0",
    "google-cloud-storage>=3.10.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.13.1",
    "rapidfuzz>=3.14.5",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

# Supply-chain quarantine: refuse to resolve any release younger than 7 days.
# Mirrors frontend/pnpm-workspace.yaml's `minimumReleaseAge: 10080`. Relative,
# so uv records it in uv.lock as `exclude-newer-span = "P7D"` and re-evaluates
# it against the clock at each resolution. See the cooldown block in
# .github/dependabot.yml — if you change this value, change that to match.
[tool.uv]
exclude-newer = "7d"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.22",
    "ty>=0.0.89",
]
scripts = [
    "playwright>=1.61.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["E501"]
"app/dependencies.py" = ["UP040"]

# ty exits 0 on warnings by default. Fail on them too, so a deprecated call or
# an unimported submodule cannot slip through CI.
[tool.ty.terminal]
error-on-warning = true

[tool.mutmut]
source_paths = ["app/services/", "app/routers/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["app/", "openapi.json", "alembic.ini", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.routers",
    "app.dependencies",
    "app.services",
    "app.schemas",
    "app.db",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Routers do not import each other"
type = "independence"
modules = [
    "app.routers.admin",
    "app.routers.auth",
    "app.routers.barcode",
    "app.routers.chains",
    "app.routers.feedback",
    "app.routers.internal",
    "app.routers.invites",
    "app.routers.items",
    "app.routers.lists",
    "app.routers.members",
    "app.routers.notifications",
    "app.routers.prices",
    "app.routers.purchases",
    "app.routers.receipt",
    "app.routers.report_opt_out",
    "app.routers.share",
    "app.routers.shortcuts",
    "app.routers.stores",
    "app.routers.suggestions",
    "app.routers.waitlist",
]
