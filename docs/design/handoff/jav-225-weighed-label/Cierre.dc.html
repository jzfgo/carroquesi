<x-dc>

<div class="bd" style="height: 780px;">

      <h1 class="t">Cerrar compra</h1>

    </div>

    <div style="padding: 8px 20px 0;">
      <div style="display: grid; grid-template-columns: 1fr 78px 52px 28px; gap: 10px; padding: 10px 0 8px; border-bottom: 1px solid #b4bac4;">

        <span class="cap" style="text-align: right;">Cant.</span>
        <span class="cap" style="text-align: right;">Importe</span>
        <span></span>
      </div>

      <div class="r10">

        </span>
        <span class="qty">0,636 kg</span>
        <span class="amt">5,72</span>
        <span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></span>
      </div>

      <div class="r10">
        <span style="font: 500 15px/1.3 'Geist', system-ui, sans-serif;">Pechuga de pollo</span>
        <button class="dash" aria-label="Escanear la etiqueta de este artículo">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg>

        <span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></span>
      </div>

      <div class="r10">
        <span style="font: 500 15px/1.3 'Geist', system-ui, sans-serif;">Contramuslo deshuesado</span>
        <button class="dash" aria-label="Escanear la etiqueta de este artículo">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg>

        <span class="quiet">sin precio</span>
        <span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></span>
      </div>

      <div class="r10">
        <span style="font: 500 15px/1.3 'Geist', system-ui, sans-serif;">Leche sin lactosa</span>
        <span class="qty">6</span>
        <span class="amt">6,90</span>
        <span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></span>

      <div class="r10">
        <span style="font: 500 15px/1.3 'Geist', system-ui, sans-serif;">Aceite v.e.</span>
        <span class="qty">1</span>
        <span class="quiet">sin precio</span>
        <span class="pen"><svg class="i" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></span>

        <span style="font: 500 15px/1.3 'Geist', system-ui, sans-serif; color: #1a3fa0;">Añadir producto</span>

        <span class="pen" style="background: rgb(26 63 160 / 8%); color: #1a3fa0;"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span>

      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0 4px; border-top: 1px solid #b4bac4; margin-top: 14px;">
        <span style="font: 400 13px/1.3 'Geist', system-ui, sans-serif; color: #353742;">Total de lo que has puesto</span>
        <span class="mono" style="font-weight: 600; font-size: 20px;">€ 12,62</span>
      </div>
      <div style="height: 14px;"></div>
    </div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 4px;">
      <button class="btn">Guardar compra</button>
      <button class="btn2">Escanear el ticket en su lugar</button>
