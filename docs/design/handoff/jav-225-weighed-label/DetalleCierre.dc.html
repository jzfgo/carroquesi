<!doctype html>

<x-dc>

<style>body{margin:0}a{color:#1a3fa0}a:hover{color:#2c56c1}
.fld{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border:1px solid #b4bac4;border-radius:10px;background:#f6f8fa;box-sizing:border-box}
.fld input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.lbl{font:600 11px/1 'Geist',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#353742}
.help{margin:8px 0 0;font:400 11.5px/1.55 'Geist',system-ui,sans-serif;color:#353742}
.help code{font:400 11px 'JetBrains Mono',monospace;color:#15161b}
</style>
</helmet>
<div class="bd" style="height: 720px;">
  <div class="sh">
    <div class="grab"></div>
    <button style="display: flex; align-items: center; gap: 4px; width: 100%; min-height: 44px; padding: 0 20px; background: transparent; border: 0; font: 500 15px/1 'Geist', system-ui, sans-serif; color: #15161b;">
      <svg class="i" viewBox="0 0 24 24" style="width: 22px; height: 22px;"><path d="m15 18-6-6 6-6"></path></svg>
      Cerrar compra
    </button>

    <div style="padding: 10px 20px 0; display: flex; flex-direction: column; gap: 18px;">
      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span class="lbl">Producto</span>
        <span class="fld"><input value="Contramuslo deshuesado" style="font: 400 15px/1 'Geist', system-ui, sans-serif; color: #15161b;"></span>
      </label>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span class="lbl">Cantidad y precio</span>
        <div style="display: flex; gap: 8px; align-items: stretch;">
          <span class="fld" style="flex: 1;"><input aria-label="Cantidad" value="1" placeholder="6" style="font: 600 17px/1 'JetBrains Mono', monospace; color: #15161b;"></span>
          <span style="align-self: center; font: 400 15px/1 'Geist', system-ui, sans-serif; color: #353742;">×</span>
          <span class="fld" style="flex: 1;">
            <input aria-label="Precio" placeholder="0,00" style="font: 600 17px/1 'JetBrains Mono', monospace; color: #15161b; text-align: right;">
            <span style="font: 400 12px/1 'Geist', system-ui, sans-serif; color: #353742;">€/ud</span>
          </span>
        </div>
        <p class="help">Escribe unidades (<code>6</code>) o peso (<code>500 ml</code>, <code>1,12 kg</code>). El precio se ajusta solo.</p>
        <button class="dash" style="min-height: 44px; width: 100%; font-size: 14px; gap: 8px; margin-top: 2px;">
          <svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px;"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg>
          Escanear etiqueta
        </button>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; padding: 9px 12px; background: #dcebe1; border-radius: 8px;">
          <span style="font: 400 12px/1 'Geist', system-ui, sans-serif; color: #353742;">Línea de la compra</span>
          <span class="mono" style="font-size: 15px; font-weight: 600;">—</span>
        </div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span class="lbl">Marca <span style="font-weight: 400; text-transform: none; letter-spacing: 0; color: #6a6d7a;">· opcional</span></span>
        <span class="fld"><input placeholder="—" style="font: 400 15px/1 'Geist', system-ui, sans-serif; color: #15161b;"></span>
      </label>
    </div>

    <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 4px;">
      <button class="btn">Hecho</button>
      <button class="lnk">Quitar del carro</button>
    </div>
  </div>
</div>
</x-dc>
