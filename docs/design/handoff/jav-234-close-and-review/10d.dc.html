<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustar producto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#d5dae2}
button{all:unset;box-sizing:border-box;cursor:pointer}
input{all:unset;box-sizing:border-box;min-width:0;width:0}
label{min-width:0}
a{color:#1a3fa0}a:hover{color:#15307f}
</style>
</helmet>
<div style="width: 402px; height: 640px; box-sizing: border-box; background: #d5dae2; padding-top: 22px; font-family: 'Geist', system-ui, sans-serif; color: #15161b">
<div style="background: #eef1f5; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 4px rgb(30 35 55 / 10%), 0 -16px 40px -6px rgb(30 35 55 / 22%); padding: 10px 0 18px; min-height: 618px; box-sizing: border-box">
  <div style="width: 36px; height: 4px; background: #b4bac4; border-radius: 2px; margin: 0 auto 12px"></div>
  <div style="display: flex; align-items: center; padding: 0 12px 12px; border-bottom: 1px solid #b4bac4">
    <button type="button" style="display: flex; align-items: center; gap: 2px; height: 44px; padding-right: 6px; color: #1a3fa0; font: 500 15px/1 'Geist', system-ui, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg> Cerrar compra</button>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <label style="display: block">
      <span style="display: block; font: 600 11px/1 'Geist', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6a6d7a; margin-bottom: 8px">Producto</span>
      <span style="display: flex; align-items: center; background: #e3e7ed; border: 1.5px solid #b4bac4; border-radius: 10px; padding: 0 12px; min-height: 48px; box-sizing: border-box">
        <input value="Leche sin lactosa" style="flex: 1; font: 500 16px/1.3 'Geist', system-ui, sans-serif; color: #15161b">
      </span>
    </label>

    <div>
      <span style="display: block; font: 600 11px/1 'Geist', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6a6d7a; margin-bottom: 8px">Cantidad y precio</span>
      <div style="display: flex; gap: 8px; align-items: stretch">
        <label style="flex: 1; display: flex; align-items: center; background: #e3e7ed; border: 1.5px solid #b4bac4; border-radius: 10px; padding: 0 12px; min-height: 48px; box-sizing: border-box">
          <input aria-label="Cantidad" value="6" style="flex: 1; font: 600 17px/1 'JetBrains Mono', monospace; color: #15161b; font-variant-numeric: tabular-nums">
        </label>
        <span style="display: flex; align-items: center; font: 400 15px/1 'Geist', system-ui, sans-serif; color: #6a6d7a">×</span>
        <label style="flex: 1; display: flex; align-items: center; gap: 6px; background: #e3e7ed; border: 1.5px solid #b4bac4; border-radius: 10px; padding: 0 12px; min-height: 48px; box-sizing: border-box">
          <input aria-label="Precio por unidad" value="1,15" style="flex: 1; font: 600 17px/1 'JetBrains Mono', monospace; color: #15161b; font-variant-numeric: tabular-nums; text-align: right">
          <span style="font: 400 12px/1 'Geist', system-ui, sans-serif; color: #353742">€/ud</span>
        </label>
      </div>
      <p style="margin: 8px 0 0; font: 400 11.5px/1.55 'Geist', system-ui, sans-serif; color: #6a6d7a">Escribe unidades (<span style="font-family: 'JetBrains Mono', monospace">6</span>) o peso (<span style="font-family: 'JetBrains Mono', monospace">500 ml</span>, <span style="font-family: 'JetBrains Mono', monospace">1,12 kg</span>). El precio se ajusta solo.</p>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; padding: 9px 12px; background: rgb(47 122 74 / 10%); border-radius: 8px">
        <span style="font: 400 12px/1.3 'Geist', system-ui, sans-serif; color: #353742">Importe</span>
        <span style="font: 600 15px/1 'JetBrains Mono', monospace; color: #15161b; font-variant-numeric: tabular-nums">6,90&nbsp;€</span>
      </div>
    </div>

    <label style="display: block">
      <span style="display: block; font: 600 11px/1 'Geist', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6a6d7a; margin-bottom: 8px">Marca <span style="font-weight: 400; letter-spacing: 0; text-transform: none">· opcional</span></span>
      <span style="display: flex; align-items: center; background: #e3e7ed; border: 1.5px solid #b4bac4; border-radius: 10px; padding: 0 12px; min-height: 48px; box-sizing: border-box">
        <input value="Kaiku" style="flex: 1; font: 500 16px/1.3 'Geist', system-ui, sans-serif; color: #15161b">
      </span>
    </label>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: #1a3fa0; color: #eef1f5; font: 600 15px/1 'Geist', system-ui, sans-serif">Hecho</button>
    <button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #c0392b; font: 400 14px/1 'Geist', system-ui, sans-serif">Quitar del carro</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
