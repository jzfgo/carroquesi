allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
minimumReleaseAge: 10080

# Security overrides: these are transitively pinned by dev tooling
# (firebase-tools, @vite-pwa/assets-generator) below the patched versions.
overrides:
  sharp: ^0.35.0
  '@hono/node-server': ^2.0.0
  uuid@<11.1.1: ^11.1.1
  # @redocly/openapi-core pins js-yaml 4.2.0 (quadratic CPU on merge-key
  # chains); the Redocly release that adopts the fix is still inside the
  # minimumReleaseAge window. Drop once 1.34.18+ ages in.
  'js-yaml@>=4.0.0 <4.3.0': ^4.3.0
  # @firebase/firestore pins grpc-js ~1.9 (unauthorized certs reported as
  # authorized). Only Firestore's Node build loads it, and the app never
  # does, but the fixed 1.x line is API-compatible.
  '@grpc/grpc-js@<1.13.6': ^1.13.6
